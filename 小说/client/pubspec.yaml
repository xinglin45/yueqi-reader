name: novel_app
description: "阅读软件：阅栖小说客户端，D1应用壳、本地存储与独立技术探针。"
publish_to: 'none'
version: 0.0.6+6

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  xml: 6.6.1
  crypto: 3.0.7
  path: 1.9.1
  path_provider: 2.1.6
  reader_storage:
    path: ../../packages/reader_storage
  phosphor_icons: 3.0.1
  platform_services:
    path: ../../packages/platform_services
  reader_core:
    path: ../../packages/reader_core
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  epub_view: 3.3.0
  html: 0.15.6

flutter:
  uses-material-design: true
  assets:
    - assets/mountain-letter-cover.png
    - assets/mac06/fixture.json
    - assets/mac06/mountain-letter.epub
